<!DOCTYPE html>
<html>
<head>
    <title>{{ profile.name }}</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
            padding:40px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:10px;
            width:400px;
            margin:auto;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:gray;
        }

        .views{
            margin-top:20px;
            font-size:14px;
        }

        button{
            padding:10px 20px;
            margin-top:20px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>{{ profile.name }}</h1>

    <p>{{ profile.bio }}</p>

    <div class="views">
        Page Views: {{ views }}
    </div>

    <br>

    <a href="/captcha">
        <button>Leave a Message</button>
    </a>

</div>

</body>
</html>
